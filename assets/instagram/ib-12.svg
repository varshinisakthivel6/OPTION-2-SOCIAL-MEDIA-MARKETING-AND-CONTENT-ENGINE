<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#111827"/><text x="80" y="150" fill="#93c5fd" font-family="Arial" font-size="34">INCUBRIX • CREATOR WORKFLOW</text><foreignObject x="80" y="260" width="920" height="400"><div xmlns="http://www.w3.org/1999/xhtml" style="font: bold 64px Arial;color:white;line-height:1.2">The simple anatomy of a useful short video</div></foreignObject><foreignObject x="80" y="740" width="920" height="400"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 38px Arial;color:#d1d5db;line-height:1.35">Hook: name the audience problem. Context: explain why it matters. Value: give two or three steps. Example: show what good looks like. CTA: ask for one next action.</div></foreignObject><text x="80" y="1240" fill="#6ee7b7" font-family="Arial" font-size="26">IB-12 • EDITABLE SVG DRAFT</text></svg>